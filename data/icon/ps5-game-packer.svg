<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mando" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- mando centrado en (0,0): 156 de ancho, 90 de alto -->
    <g id="pad">
      <path fill="url(#mando)" filter="url(#sombra)" d="
        M -42 -45 H 42
        C 64 -45 78 -33 78 -13
        V 13
        C 78 33 66 45 48 45
        C 38 45 32 39 26 31
        H -26
        C -32 39 -38 45 -48 45
        C -66 45 -78 33 -78 13
        V -13
        C -78 -33 -64 -45 -42 -45 Z"/>
      <!-- panel tactil -->
      <rect x="-16" y="-37" width="32" height="14" rx="5" fill="#94a3b8"/>
      <!-- cruceta -->
      <g fill="#334155">
        <rect x="-60" y="-13" width="34" height="10" rx="4"/>
        <rect x="-48" y="-25" width="10" height="34" rx="4"/>
      </g>
      <!-- cuatro botones neutros -->
      <g fill="#64748b">
        <circle cx="51" cy="-21" r="6"/>
        <circle cx="62" cy="-8" r="6"/>
        <circle cx="40" cy="-8" r="6"/>
        <circle cx="51" cy="5" r="6"/>
      </g>
      <!-- sticks -->
      <circle cx="-22" cy="23" r="9" fill="#475569"/>
      <circle cx="22" cy="23" r="9" fill="#475569"/>
      <circle cx="-22" cy="23" r="4" fill="#1e293b"/>
      <circle cx="22" cy="23" r="4" fill="#1e293b"/>
    </g>
  </defs>

  <!-- fondo -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#fondo)"/>
  <rect x="8" y="8" width="240" height="120" rx="52" fill="#ffffff" opacity="0.06"/>

  <!-- mando grande -->
  <use xlink:href="#pad" transform="translate(78 112) scale(0.80)"/>

  <!-- flecha -->
  <g fill="none" stroke="#38bdf8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 146 112 H 180"/>
    <path d="M 168 96 L 184 112 L 168 128"/>
  </g>

  <!-- mando pequeno -->
  <use xlink:href="#pad" transform="translate(220 112) scale(0.36)"/>

  <!-- etiqueta -->
  <text x="128" y="222" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="30" fill="#e0f2fe" letter-spacing="2">PS5</text>
</svg>
